@for (pos of positions; track pos) {
  @if (toastsAt(pos).length > 0) {
    <div
      class="toast-container toast-pos-{{ pos }}"
      aria-live="polite"
      [attr.aria-label]="'Notifications ' + pos"
    >
      @for (t of toastsAt(pos); track t.id) {
        <div
          class="toast-item toast-{{ t.type }}"
          role="alert"
          [id]="t.id"
        >
          <i class="bi toast-icon {{ iconFor(t.type) }}" aria-hidden="true"></i>
          <span class="toast-message">{{ t.message }}</span>
          <button
            type="button"
            class="toast-close"
            (click)="close(t.id)"
            [attr.aria-label]="'Dismiss'"
          >
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </div>
      }
    </div>
  }
}
