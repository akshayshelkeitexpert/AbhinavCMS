<h2 class="h4 mb-4">CRM Dashboard</h2>

@if (errorMessage) {
  <div class="alert alert-warning">{{ errorMessage }}</div>
}
@if (loading) {
  <p class="text-muted">Loading dashboard...</p>
} @else {
  <div class="row g-4">
    <div class="col-md-6">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex align-items-center justify-content-between">
          <div>
            <h6 class="text-muted mb-1">Contacted Customers</h6>
            <h3 class="mb-0">{{ contactedCount }}</h3>
          </div>
          <a routerLink="/crm/contacted-list" class="btn btn-outline-primary btn-sm">View list</a>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex align-items-center justify-content-between">
          <div>
            <h6 class="text-muted mb-1">Quotes Requested</h6>
            <h3 class="mb-0">{{ quotesRequestedCount }}</h3>
          </div>
          <a routerLink="/crm/quotes-request" class="btn btn-outline-primary btn-sm">View list</a>
        </div>
      </div>
    </div>
  </div>
}
